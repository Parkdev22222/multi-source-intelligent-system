<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSIS – 위성 감시 대시보드</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:    #0a0e14; --panel: #111820; --border: #1e3040;
      --green: #00ff88; --amber: #ffb300; --red:   #ff4040;
      --blue:  #40aaff; --text:  #c8d8e8; --dim:   #5a7a90;
      --font:  'Courier New', Courier, monospace;
    }
    html, body { height:100%; background:var(--bg); color:var(--text); font-family:var(--font); font-size:13px; overflow:hidden; }

    /* ── 레이아웃 ── */
    #app { display:flex; height:100vh; }

    /* 좌측 사이드바 */
    #sidebar { width:270px; min-width:270px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }

    #sb-header { padding:12px 14px; background:#0d1520; border-bottom:1px solid var(--border); }
    #sb-header h1 { font-size:13px; color:var(--green); letter-spacing:2px; }
    #sb-header .sub { color:var(--dim); font-size:10px; margin-top:2px; }

    /* 시뮬레이터 컨트롤 */
    #sim-panel { padding:10px 12px; background:#0b1520; border-bottom:1px solid var(--border); }
    .sim-title { color:var(--amber); font-size:10px; letter-spacing:1px; margin-bottom:8px; }
    #run-btn {
      width:100%; padding:8px 0; background:transparent; border:1px solid var(--green);
      color:var(--green); cursor:pointer; font-family:var(--font); font-size:12px;
      border-radius:3px; letter-spacing:1px; transition:all .15s;
    }
    #run-btn:hover:not(:disabled) { background:var(--green); color:#000; }
    #run-btn:disabled { opacity:.4; cursor:not-allowed; }
    #sim-status { margin-top:6px; font-size:10px; color:var(--dim); min-height:14px; }
    #sim-progress { height:2px; background:var(--border); margin-top:6px; border-radius:1px; overflow:hidden; }
    #sim-progress-bar { height:100%; width:0; background:var(--green); transition:width .3s; }

    /* 위성 목록 */
    #sat-list-hdr { display:flex; justify-content:space-between; padding:6px 12px; font-size:10px; color:var(--dim); border-bottom:1px solid var(--border); background:#0d1520; }
    #sat-count { color:var(--amber); }
    #sat-list { overflow-y:auto; flex:1; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
    .sat-item { padding:6px 12px; border-bottom:1px solid #0d1520; cursor:pointer; transition:background .1s; }
    .sat-item:hover { background:#152030; }
    .sat-item.active { background:#1a2d40; border-left:3px solid var(--green); }
    .sat-name { font-size:11px; color:var(--text); }
    .sat-meta { font-size:10px; color:var(--dim); margin-top:1px; }
    .sat-pos  { font-size:10px; color:var(--blue); margin-top:1px; }

    /* 하단 갱신 바 */
    #refresh-bar { padding:6px 12px; border-top:1px solid var(--border); display:flex; gap:8px; align-items:center; }
    #refresh-btn { padding:4px 10px; background:transparent; border:1px solid var(--green); color:var(--green); cursor:pointer; font-family:var(--font); font-size:10px; border-radius:3px; transition:all .15s; }
    #refresh-btn:hover { background:var(--green); color:#000; }
    #refresh-ts { font-size:10px; color:var(--dim); }

    /* ── 지도 ── */
    #map-wrap { flex:1; position:relative; }
    #map { width:100%; height:100%; }

    /* ── 우측 상세 패널 ── */
    #detail-panel { width:330px; min-width:330px; background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column; }
    #detail-panel.hidden { display:none; }
    #dp-header { padding:10px 14px; background:#0d1520; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    #dp-title { font-size:12px; color:var(--amber); letter-spacing:1px; }
    #dp-close { cursor:pointer; color:var(--dim); font-size:16px; }
    #dp-close:hover { color:var(--red); }

    #dp-sat-info { padding:10px 14px; background:#0c1219; border-bottom:1px solid var(--border); }
    #dp-sat-name { font-size:13px; color:var(--green); font-weight:bold; margin-bottom:4px; }
    #dp-sat-detail { font-size:10px; color:var(--dim); line-height:1.7; }

    #dp-image-wrap { padding:10px 14px; border-bottom:1px solid var(--border); }
    .dp-sec { font-size:10px; color:var(--amber); letter-spacing:1px; margin-bottom:6px; }
    #dp-image { width:100%; border:1px solid var(--border); border-radius:3px; display:none; }
    #dp-img-meta { font-size:9px; color:var(--dim); margin-top:4px; line-height:1.5; }
    #dp-no-image { font-size:11px; color:var(--dim); }

    #dp-detections { padding:10px 14px; flex:1; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
    .det-row { display:flex; justify-content:space-between; align-items:center; padding:4px 8px; margin:3px 0; border:1px solid var(--border); background:#0c1520; border-radius:2px; }
    .det-cls { font-size:10px; color:var(--text); }
    .det-conf { font-size:10px; color:var(--green); font-weight:bold; }
    #dp-no-det { font-size:11px; color:var(--dim); }

    #dp-hint { padding:6px 14px; border-top:1px solid var(--border); font-size:10px; color:var(--dim); text-align:center; background:#0d1520; }

    /* ── 보고서 모달 ── */
    #report-modal { display:none; position:fixed; inset:0; z-index:9000; background:rgba(0,0,0,.75); align-items:center; justify-content:center; }
    #report-modal.open { display:flex; }
    #report-box { width:700px; max-width:96vw; max-height:88vh; background:var(--panel); border:1px solid var(--border); border-radius:4px; display:flex; flex-direction:column; overflow:hidden; }
    #report-hdr { padding:10px 16px; background:#0d1520; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    #report-hdr h2 { font-size:13px; color:var(--amber); letter-spacing:1px; }
    #report-hdr-close { cursor:pointer; color:var(--dim); font-size:18px; }
    #report-hdr-close:hover { color:var(--red); }
    #report-meta { padding:8px 16px; border-bottom:1px solid var(--border); font-size:10px; color:var(--dim); line-height:1.6; }
    #report-body { flex:1; overflow-y:auto; padding:14px 16px; }
    #report-content { white-space:pre-wrap; font-size:11px; color:var(--text); line-height:1.7; }

    /* 다운로드 버튼 (우하단 고정) */
    #download-btn { position:fixed; bottom:24px; right:24px; z-index:9100; padding:10px 20px; background:var(--amber); color:#000; border:none; border-radius:4px; cursor:pointer; font-family:var(--font); font-size:12px; font-weight:bold; letter-spacing:1px; display:none; transition:background .15s; }
    #download-btn:hover { background:#ffd040; }

    /* ── 마커 스타일 ── */
    .sat-dot { width:10px; height:10px; border-radius:50%; border:2px solid; cursor:pointer; transition:transform .1s; }
    .sat-dot:hover { transform:scale(1.8); }
    .sat-dot.military { background:rgba(255,64,64,.5); border-color:#ff4040; }
    .sat-dot.active-sat { background:rgba(0,255,136,.6); border-color:#00ff88; box-shadow:0 0 8px #00ff88; }

    /* 스피너 */
    #spinner { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:var(--green); font-size:13px; z-index:999; background:rgba(10,14,20,.85); padding:10px 20px; border:1px solid var(--border); border-radius:4px; }
  </style>
</head>
<body>
<div id="app">

  <!-- ── 좌측 사이드바 ── -->
  <div id="sidebar">
    <div id="sb-header">
      <h1>◈ MSIS SATELLITE</h1>
      <div class="sub">Multi-Source Intelligent System</div>
    </div>

    <!-- 시뮬레이터 컨트롤 -->
    <div id="sim-panel">
      <div class="sim-title">◈ 위성 모의기</div>
      <button id="run-btn">▶ 시뮬레이션 1스텝 실행</button>
      <div id="sim-status">대기 중 – 버튼을 눌러 탐지 + 보고서 생성</div>
      <div id="sim-progress"><div id="sim-progress-bar"></div></div>
    </div>

    <div id="sat-list-hdr">
      <span>위성 목록 (모의기)</span>
      <span id="sat-count">0개</span>
    </div>
    <div id="sat-list"></div>

    <div id="refresh-bar">
      <button id="refresh-btn">↺ 위치 갱신</button>
      <span id="refresh-ts">—</span>
    </div>
  </div>

  <!-- ── 지도 ── -->
  <div id="map-wrap">
    <div id="map"></div>
    <div id="spinner">처리 중...</div>
  </div>

  <!-- ── 우측 상세 패널 ── -->
  <div id="detail-panel" class="hidden">
    <div id="dp-header">
      <span id="dp-title">위성 정보</span>
      <span id="dp-close">✕</span>
    </div>
    <div id="dp-sat-info">
      <div id="dp-sat-name">—</div>
      <div id="dp-sat-detail">—</div>
    </div>
    <div id="dp-image-wrap">
      <div class="dp-sec">◈ 위성 영상 (DB 최신)</div>
      <img id="dp-image" alt="위성 영상" />
      <div id="dp-img-meta"></div>
      <div id="dp-no-image">영상 없음 – 시뮬레이션을 먼저 실행하세요</div>
    </div>
    <div id="dp-detections">
      <div class="dp-sec">◈ SAM3 객체탐지 결과 (DB 최신)</div>
      <div id="det-list"></div>
      <div id="dp-no-det" style="display:none">탐지 결과 없음</div>
    </div>
    <div id="dp-hint">더블클릭 → 판독 보고서 열기</div>
  </div>

</div>

<!-- ── 보고서 모달 ── -->
<div id="report-modal">
  <div id="report-box">
    <div id="report-hdr">
      <h2>◈ 위성 판독 보고서</h2>
      <span id="report-hdr-close">✕</span>
    </div>
    <div id="report-meta">로딩 중...</div>
    <div id="report-body"><pre id="report-content"></pre></div>
  </div>
</div>
<button id="download-btn">⬇ 보고서 다운로드</button>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   MSIS Dashboard – 위성 모의기 + SAM3 탐지 결과 + 판독보고서 UI
   ═══════════════════════════════════════════════════════════════════════ */

const API = '';
let map, satMarkers = [], activeSatId = null, hoverTimer = null;
let satellites = [];

/* ── 지도 초기화 ── */
function initMap() {
  map = L.map('map', { center: [30, 100], zoom: 3, preferCanvas: true });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO', maxZoom: 18, subdomains: 'abcd',
  }).addTo(map);
}

/* ── 위성 위치 로드 (모의기) ── */
async function loadSatellites() {
  try {
    const res = await fetch(`${API}/api/satellites`);
    if (!res.ok) return;
    const data = await res.json();
    satellites = data.satellites || [];
    renderMarkers();
    renderSidebarList();
    document.getElementById('sat-count').textContent = `${satellites.length}개`;
    document.getElementById('refresh-ts').textContent =
      `갱신: ${new Date().toLocaleTimeString('ko-KR')}`;
  } catch(e) { console.warn('[Satellites]', e); }
}

/* ── 마커 렌더링 ── */
function renderMarkers() {
  satMarkers.forEach(m => m.remove());
  satMarkers = [];

  satellites.forEach(sat => {
    const isActive = (sat.id === activeSatId);
    const el = document.createElement('div');
    el.className = `sat-dot ${isActive ? 'active-sat' : 'military'}`;
    el.title = sat.name;

    const marker = L.marker([sat.lat, sat.lon], {
      icon: L.divIcon({ html: el, className: '', iconSize: [10, 10], iconAnchor: [5, 5] }),
    }).addTo(map);

    marker._sat = sat;

    marker.on('mouseover', () => {
      clearTimeout(hoverTimer);
      hoverTimer = setTimeout(() => showDetail(sat), 250);
    });
    marker.on('dblclick', e => {
      L.DomEvent.stopPropagation(e);
      openReport(sat.lat, sat.lon);
    });

    satMarkers.push(marker);
  });
}

/* ── 사이드바 목록 ── */
function renderSidebarList() {
  const list = document.getElementById('sat-list');
  list.innerHTML = '';
  satellites.forEach(sat => {
    const div = document.createElement('div');
    div.className = `sat-item${sat.id === activeSatId ? ' active' : ''}`;
    div.innerHTML = `
      <div class="sat-name">${sat.name}</div>
      <div class="sat-meta">${sat.id} · ${sat.country} · 고도 ${sat.alt_km}km</div>
      <div class="sat-pos">LAT ${sat.lat.toFixed(3)}° &nbsp; LON ${sat.lon.toFixed(3)}°</div>`;
    div.addEventListener('mouseenter', () => showDetail(sat));
    div.addEventListener('dblclick', () => openReport(sat.lat, sat.lon));
    list.appendChild(div);
  });
}

/* ── 위성 상세 패널 (호버) ── */
async function showDetail(sat) {
  document.getElementById('detail-panel').classList.remove('hidden');
  document.getElementById('dp-sat-name').textContent = sat.name;
  document.getElementById('dp-sat-detail').innerHTML =
    `ID: ${sat.id}  |  국가: ${sat.country}<br>` +
    `고도: ${sat.alt_km} km  |  경사각: ${sat.inclination}°<br>` +
    `주기: ${sat.period_min}분<br>` +
    `현재 위치: ${sat.lat.toFixed(4)}°N  ${sat.lon.toFixed(4)}°E`;

  // 영상
  const img = document.getElementById('dp-image');
  const noImg = document.getElementById('dp-no-image');
  const meta = document.getElementById('dp-img-meta');
  img.style.display = 'none'; noImg.style.display = 'block'; meta.textContent = '';

  // 탐지
  const detList = document.getElementById('det-list');
  const noDet = document.getElementById('dp-no-det');
  detList.innerHTML = ''; noDet.style.display = 'none';

  // DB에서 해당 위치 영상 조회
  try {
    const r = await fetch(`${API}/api/image/latest?lat=${sat.lat}&lon=${sat.lon}&radius=5`);
    if (r.ok) {
      const d = await r.json();
      if (d.image_b64) {
        img.src = `data:image/png;base64,${d.image_b64}`;
        img.style.display = 'block'; noImg.style.display = 'none';
        meta.innerHTML =
          `촬영: ${d.capture_time ? new Date(d.capture_time).toLocaleString('ko-KR') : '—'}<br>` +
          `플랫폼: ${d.sensor_platform || '—'}  |  해상도: ${d.resolution_m || '—'}m/px`;
      }
    }
  } catch(e) { console.warn('[Image]', e); }

  // DB에서 탐지 결과 조회
  try {
    const r = await fetch(`${API}/api/detections?lat=${sat.lat}&lon=${sat.lon}&radius=5`);
    if (r.ok) {
      const d = await r.json();
      if (d.detections && d.detections.length) {
        d.detections.forEach(det => {
          const row = document.createElement('div');
          row.className = 'det-row';
          row.innerHTML = `<span class="det-cls">${det.object_class}</span>
                           <span class="det-conf">${(det.confidence*100).toFixed(1)}%</span>`;
          detList.appendChild(row);
        });
      } else { noDet.style.display = 'block'; }
    } else { noDet.style.display = 'block'; }
  } catch(e) { noDet.style.display = 'block'; }
}

document.getElementById('dp-close').addEventListener('click', () => {
  document.getElementById('detail-panel').classList.add('hidden');
});

/* ── 시뮬레이션 1스텝 실행 ── */
document.getElementById('run-btn').addEventListener('click', async () => {
  const btn = document.getElementById('run-btn');
  const status = document.getElementById('sim-status');
  const bar = document.getElementById('sim-progress-bar');

  btn.disabled = true;
  document.getElementById('spinner').style.display = 'block';

  // 진행 애니메이션
  let progress = 0;
  const timer = setInterval(() => {
    progress = Math.min(progress + 2, 90);
    bar.style.width = progress + '%';
  }, 300);

  const steps = [
    '위성 궤도 계산 중...',
    '이미지 2장 선택 중...',
    'metadata.json 갱신 중...',
    'SAM3 탐지 실행 중...',
    '시간적 페어링 처리 중...',
    '판독 보고서 생성 중...',
  ];
  let si = 0;
  status.textContent = steps[si];
  const stepTimer = setInterval(() => {
    si = Math.min(si + 1, steps.length - 1);
    status.textContent = steps[si];
  }, 2500);

  try {
    const res = await fetch(`${API}/api/simulator/step`, { method: 'POST' });
    clearInterval(timer); clearInterval(stepTimer);
    bar.style.width = '100%';

    if (res.ok) {
      const data = await res.json();
      activeSatId = data.active?.id || null;

      // 위성 위치 업데이트
      if (data.satellites) {
        satellites = data.satellites;
        renderMarkers();
        renderSidebarList();
      }

      if (data.success) {
        status.textContent = `✓ 완료 (${data.elapsed_s}s) | 이미지: ${(data.images||[]).map(p=>p.split('/').pop()).join(', ')}`;
        // 활성 위성 패널 자동 열기
        if (data.active) showDetail(data.active);
      } else {
        status.textContent = `⚠ 파이프라인 오류 – DB에 기존 데이터 유지`;
      }
    } else {
      status.textContent = '오류: 서버 응답 실패';
    }
  } catch(e) {
    clearInterval(timer); clearInterval(stepTimer);
    status.textContent = `오류: ${e.message}`;
  } finally {
    document.getElementById('spinner').style.display = 'none';
    btn.disabled = false;
    setTimeout(() => { bar.style.width = '0'; }, 2000);
  }
});

/* ── 위치 갱신 버튼 ── */
document.getElementById('refresh-btn').addEventListener('click', loadSatellites);

/* ── 보고서 모달 (더블클릭) ── */
async function openReport(lat, lon) {
  const modal = document.getElementById('report-modal');
  const meta  = document.getElementById('report-meta');
  const content = document.getElementById('report-content');
  const dlBtn = document.getElementById('download-btn');

  modal.classList.add('open');
  meta.textContent = '보고서 로딩 중...';
  content.textContent = '';
  dlBtn.style.display = 'none';

  try {
    const res = await fetch(`${API}/api/report/latest?lat=${lat}&lon=${lon}&radius=5`);
    if (!res.ok) {
      const err = await res.json();
      meta.textContent = `오류: ${err.detail || res.statusText}`;
      return;
    }
    const report = await res.json();
    meta.innerHTML =
      `ID: ${report.id}<br>` +
      `생성: ${report.report_time ? new Date(report.report_time).toLocaleString('ko-KR') : '—'}<br>` +
      `LLM: ${report.llm_model || '—'} (${report.llm_backend || '—'})  |  페어링: ${report.pairing_count}건`;
    content.textContent = report.report_content || '(내용 없음)';
    dlBtn.style.display = 'block';
    dlBtn.onclick = () => {
      const ts = report.report_time
        ? new Date(report.report_time).toISOString().replace(/[:.]/g,'-')
        : 'report';
      const blob = new Blob([report.report_content||''], {type:'text/plain;charset=utf-8'});
      const a = Object.assign(document.createElement('a'), {
        href: URL.createObjectURL(blob), download: `MSIS_report_${ts}.txt`
      });
      a.click(); URL.revokeObjectURL(a.href);
    };
  } catch(e) {
    meta.textContent = `네트워크 오류: ${e.message}`;
  }
}

/* 모달 닫기 */
document.getElementById('report-hdr-close').addEventListener('click', () => {
  document.getElementById('report-modal').classList.remove('open');
  document.getElementById('download-btn').style.display = 'none';
});
document.getElementById('report-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('report-modal')) {
    document.getElementById('report-modal').classList.remove('open');
    document.getElementById('download-btn').style.display = 'none';
  }
});

/* ── 자동 위치 갱신 (10초) ── */
setInterval(loadSatellites, 10_000);

/* ── 부트 ── */
initMap();
loadSatellites();
</script>
</body>
</html>
